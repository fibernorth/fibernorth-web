<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1B2838;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E2D3D;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="dirtGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#5C4033;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3E2B22;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Sky/top background -->
  <rect width="600" height="300" fill="url(#skyGrad)" rx="8"/>

  <!-- Ground/earth section -->
  <rect x="0" y="170" width="600" height="130" fill="url(#dirtGrad)" rx="0"/>
  <rect x="0" y="292" width="600" height="8" fill="url(#skyGrad)" rx="0 0 8 8"/>

  <!-- Grass line -->
  <rect x="0" y="168" width="600" height="6" fill="#4A7F4E" rx="2"/>

  <!-- Surface elements - small tree left -->
  <rect x="60" y="130" width="6" height="38" fill="#5C4033"/>
  <circle cx="63" cy="120" r="18" fill="#3D6B41"/>
  <circle cx="50" cy="128" r="12" fill="#4A7F4E"/>
  <circle cx="76" cy="126" r="14" fill="#357A3A"/>

  <!-- Surface elements - house silhouette right -->
  <rect x="460" y="118" width="70" height="50" fill="#2A3A4A"/>
  <polygon points="455,118 495,88 535,118" fill="#3A4A5A"/>
  <rect x="480" y="138" width="16" height="30" fill="#F4A42B" opacity="0.6"/>

  <!-- FN text above ground -->
  <text x="180" y="155" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="70" fill="white" letter-spacing="-2">FN</text>

  <!-- UNDERGROUND text below ground line -->
  <text x="140" y="215" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="32" fill="#E8C47A" letter-spacing="6">UNDERGROUND</text>

  <!-- Bore path through earth -->
  <path d="M 70 200 Q 70 250, 150 250 Q 300 250, 350 235 Q 400 220, 470 240 Q 500 248, 520 200"
        stroke="#F4A42B" stroke-width="3.5" fill="none" stroke-linecap="round"/>

  <!-- Pipe inside bore path -->
  <path d="M 70 200 Q 70 250, 150 250 Q 300 250, 350 235 Q 400 220, 470 240 Q 500 248, 520 200"
        stroke="#D4862A" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-dasharray="4,8"/>

  <!-- Entry hole -->
  <ellipse cx="70" cy="171" rx="8" ry="4" fill="#3E2B22" stroke="#F4A42B" stroke-width="2"/>

  <!-- Exit hole -->
  <ellipse cx="520" cy="171" rx="8" ry="4" fill="#3E2B22" stroke="#F4A42B" stroke-width="2"/>

  <!-- Small label -->
  <text x="175" y="270" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="11" fill="#8A7A6A" letter-spacing="3">YOUR YARD STAYS INTACT</text>

  <!-- Surface intact indicators -->
  <text x="265" y="165" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="9" fill="#4A7F4E" letter-spacing="1">SURFACE UNDISTURBED</text>
</svg>
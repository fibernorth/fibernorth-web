<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300">
  <defs>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#D4D4D4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9CA3AF;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="300" fill="#0C1017" rx="8"/>

  <!-- Left vertical accent bar -->
  <rect x="95" y="45" width="4" height="210" fill="#E8672A" rx="2"/>

  <!-- FN - massive, industrial -->
  <text x="115" y="145" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="115" fill="url(#metalGrad)" letter-spacing="5">FN</text>

  <!-- UNDERGROUND stacked right, aligned to N -->
  <text x="310" y="82" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="20" fill="#E8672A" letter-spacing="10">UNDER</text>
  <text x="310" y="112" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="20" fill="#E8672A" letter-spacing="10">GROUND</text>

  <!-- Horizontal rule under FN -->
  <rect x="115" y="160" width="390" height="1" fill="#2A3545"/>

  <!-- Bore path schematic below the line -->
  <circle cx="140" cy="185" r="5" fill="none" stroke="#F4A42B" stroke-width="1.5"/>
  <path d="M 145 185 L 180 185 Q 200 185, 200 200 Q 200 215, 220 215 L 420 215 Q 440 215, 440 200 Q 440 185, 460 185 L 480 185"
        stroke="#F4A42B" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <polygon points="483,181 493,185 483,189" fill="#F4A42B"/>

  <!-- Labels on bore path -->
  <text x="135" y="205" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="8" fill="#5A6577" text-anchor="middle">ENTRY</text>
  <text x="488" y="205" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="8" fill="#5A6577" text-anchor="middle">EXIT</text>

  <!-- Tagline at bottom -->
  <text x="115" y="255" font-family="Arial, Helvetica, sans-serif" font-weight="300" font-size="11" fill="#4A5568" letter-spacing="3">DIRECTIONAL DRILLING &amp; TRENCHLESS INSTALLATIONS</text>
</svg>